<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SurviveIO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MENU PRINCIPAL -->
  <div id="main-menu">
    <div class="menu-background"></div>

    <div class="menu-content">

      <div class="game-logo">
        <div class="logo-title">SURVIVE<span>IO</span></div>
        <div class="logo-subtitle">SURVIVE • BUILD • FIGHT</div>
      </div>

      <div class="menu-buttons">
        <button id="play-button" class="menu-button main-button">
          🎮 JOUER
        </button>

        <button class="menu-button">
          👤 PROFIL
        </button>

        <button class="menu-button">
          🏆 CLASSEMENTS
        </button>

        <button class="menu-button">
          👥 CLANS
        </button>

        <button class="menu-button">
          ⚙️ PARAMÈTRES
        </button>
      </div>

      <div class="menu-version">
        SURVIVEIO • ALPHA
      </div>

    </div>
  </div>


  <!-- JEU -->
  <div id="game-container" style="display: none;">

    <div id="ui">

      <div id="stats">
        <div class="stat">❤️ <span id="hp">100</span></div>
        <div class="stat">🛡️ <span id="armor">0</span></div>
        <div class="stat">⚡ <span id="xp">0</span> / <span id="xp-max">100</span></div>
        <div class="stat">LVL <span id="level">1</span></div>
        <div class="stat">🌙 Wave <span id="wave">0</span></div>
        <div class="stat">🧟 <span id="kills">0</span></div>
      </div>

      <div id="resources">
        <span class="res">🪵 <span id="wood">0</span></span>
        <span class="res">🪨 <span id="stone">0</span></span>
        <span class="res">⛏️ <span id="iron">0</span></span>
        <span class="res">💎 <span id="crystal">0</span></span>
      </div>

      <div id="minimap-container">
        <canvas id="minimap" width="120" height="120"></canvas>
      </div>

    </div>

    <canvas id="game"></canvas>

    <div id="build-bar">
      <button class="build-btn" data-type="wall" title="Mur (Bois x5)">🧱</button>
      <button class="build-btn" data-type="door" title="Porte (Bois x8)">🚪</button>
      <button class="build-btn" data-type="chest" title="Coffre (Bois x10)">📦</button>
      <button class="build-btn" data-type="turret" title="Tourelle (Pierre x15 + Fer x5)">🔫</button>
      <button class="build-btn" data-type="farm" title="Ferme (Bois x12)">🌾</button>
    </div>

    <div id="info">
      ZQSD / WASD pour bouger • Clic pour attaquer • E pour récolter • 1-5 pour construire
    </div>

  </div>

  <script src="game.js"></script>

</body>
</html>
